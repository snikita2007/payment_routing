# Поля, которых нет в providers.json.
#
# ТЗ прямо предлагает командам задать их самим: volume_share_pct, priority,
# requests_per_minute_limit, daily_turnover_min, daily_turnover_max.
# Держим их здесь, а не в data/providers.json, потому что на сдаче организаторы
# пришлют свой providers.json вместе с operations_queue_test.json — правки в файле
# данных пропадут, а этот оверлей переживёт подмену.
#
#   defaults  — заполняют только то, чего в данных нет; если организаторы поле пришлют,
#               выигрывает их значение
#   overrides — выигрывают всегда, это ручная подкрутка целей
#
# Провайдер, которого здесь нет, берёт только секцию all.

# daily_turnover_min ставим близко к уже набранному обороту, а не «по-хорошему бы столько».
# Фактор M считает недобор в долях от обязательства, и недостижимый минимум превращает его
# в постоянную надбавку на весь прогон: очередь на 385 тыс. не закроет разрыв в 1.9 млн,
# поэтому M так и простоит константой и будет молча перебивать целевую долю.
# Обязательство, до которого можно дотянуться, гаснет само, как только оно выполнено, —
# именно так soft-цель и должна себя вести.

defaults:
  # Общий потолок интенсивности для незнакомых провайдеров.
  all:
    requests_per_minute_limit: 30

  vipay:
    # Потолок чека 100k, оборот 3.2 из 5 млн — объём тянет средне.
    volume_share_pct: 35
    daily_turnover_min: 3300000
    requests_per_minute_limit: 25

  payflow:
    # Потолок чека 50k и всего 100k свободного дневного лимита: объём на нём не вывезти.
    volume_share_pct: 20
    daily_turnover_min: 2950000
    requests_per_minute_limit: 15

  quickpay:
    # Единственный, кто берёт чеки больше 100k; оборот 1.1 из 8 млн — запас большой.
    volume_share_pct: 45
    daily_turnover_min: 1200000
    requests_per_minute_limit: 40

# Пусто по умолчанию. Сюда кладут значение, когда надо перебить данные организаторов,
# например временно срезать целевую долю провайдеру, который упёрся в дневной лимит:
#
# overrides:
#   payflow:
#     traffic_percentage: 20
overrides: {}
